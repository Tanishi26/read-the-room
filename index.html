<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Read the Room</title>
  <meta name="description" content="A short study on tone and getting to know people online. Read a chat, decide what you'd do, get your Decision DNA.">
  <meta property="og:title" content="Read the Room — can you read tone over text?">
  <meta property="og:description" content="A 13-minute study on tone in online chats. Anonymous, phone-friendly, with personal results at the end.">
  <meta name="theme-color" content="#fbf5ee">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23e5486f'/><path d='M16 22a8 8 0 0 1 8-8h16a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8H30l-9 7v-7a8 8 0 0 1-5-7z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/survey.css">
</head>
<body>
  <div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--accent)"/><path d="M16 22a8 8 0 0 1 8-8h16a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8H30l-9 7v-7a8 8 0 0 1-5-7z" fill="#fff"/></svg>
      <span>Read the Room</span>
      <span id="mode-badge" class="mode-badge" hidden>test mode</span>
    </div>
    <span id="section-label" class="section-label"></span>
  </header>
  <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>

  <main>
    <section id="screen" class="screen" aria-live="polite"></section>
  </main>

  <footer class="actionbar">
    <div class="actionbar-inner">
      <button id="peek" class="ghost" type="button" hidden>👀 See chat again</button>
      <div class="next-wrap">
        <p id="next-hint" class="next-hint" role="status"></p>
        <button id="next" class="btn" type="button">Continue</button>
      </div>
    </div>
  </footer>

  <dialog id="peek-dialog" aria-label="Conversation">
    <div class="peek-body"></div>
    <button id="peek-close" class="btn" type="button">Close</button>
  </dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/survey.js"></script>
</body>
</html>
